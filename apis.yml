apis:
- name: Backstory MCP
  description: >-
    Backstory's hosted, remote Model Context Protocol server. It lets an AI
    client query a customer's own Backstory revenue-intelligence data —
    accounts, opportunities, recent activity, engaged people, scorecards,
    company news, and SalesAI analysis — in natural language. Thirteen tools are
    published across four families: finding accounts and opportunities,
    strategic summaries, activity and engagement review, and advanced sales
    analysis (including a beta Situation Search that returns historically
    similar deals with the actions taken and the outcome). Authorization is
    OAuth 2.0 authorization_code with PKCE and dynamic client registration; a
    connected client inherits exactly the record permissions the authenticating
    user already has in Backstory Engagement Dashboards and gains nothing more.
  humanURL: https://www.backstory.ai/platform/mcp
  baseURL: https://mcp.people.ai/mcp

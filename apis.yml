aid: backstory
name: Backstory
description: >-
  Backstory (formerly People.ai, rebranded April 2026) is an AI revenue
  intelligence platform for sales leaders, CROs, and revenue teams. It
  automatically captures customer interactions across email, meetings, calls,
  chat, and CRM records, maps that activity to open deals, and reconstructs
  what is actually happening inside a deal or account — flagging which deals
  are losing momentum, where decision-makers are missing, whether a forecast is
  defensible, and the recommended next step. It integrates with Salesforce,
  Microsoft Dynamics, Oracle, Gmail, Outlook, Zoom, Teams, and Slack without
  requiring reps to change their workflow. Backstory is backed by ICONIQ
  Capital, Andreessen Horowitz, and Lightspeed Venture Partners. It publishes
  no public developer API today (the product API is enterprise/partner gated),
  though it has stated an "open APIs and MCP" vision for agent workflows.

notes: >-
  Backstory serves real /.well-known discovery documents, but only on its MCP
  host: RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata, both HTTP 200 with real JSON. The marketing, app and API hosts serve
  nothing. No security.txt authored by Backstory, no api-catalog, no OIDC
  discovery, and no A2A agent card at either the canonical
  /.well-known/agent-card.json or the legacy /.well-known/agent.json on any host.

aid: backstory
name: Backstory
description: >-
  Backstory (formerly People.ai, rebranded April 2026) is an AI revenue
  intelligence platform for sales leaders, CROs, and revenue teams. It
  automatically captures customer interactions across email, meetings, calls,
  chat, and CRM records, maps that activity to open deals, and reconstructs
  what is actually happening inside a deal or account — flagging which deals
  are losing momentum, where decision-makers are missing, whether a forecast is
  defensible, and the recommended next step. It integrates with Salesforce,
  Microsoft Dynamics, Oracle, Gmail, Outlook, Zoom, Teams, Webex, and Slack
  without requiring reps to change their workflow. Backstory's public developer
  surface is agent-native rather than REST: it operates a hosted, remote MCP
  server at https://mcp.people.ai/mcp with thirteen documented tools, protected
  by OAuth 2.0 with PKCE and dynamic client registration, and documented for
  Claude, ChatGPT, Microsoft Copilot, Gemini CLI and n8n. A separate REST API
  exists but is documented only as admin-panel API key management, with no
  published reference or specification. Backstory is backed by ICONIQ Capital,
  Andreessen Horowitz, and Lightspeed Venture Partners.
